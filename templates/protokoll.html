{% extends "base.html" %}
{% block title %}Protokoll{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-xl font-semibold">Protokoll</h1>
  <a href="/api/logs" target="_blank"
     class="text-sm bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg transition-colors">
    Als JSON öffnen
  </a>
</div>

<div id="log-view"
     hx-get="/api/logs-partial"
     hx-trigger="load, every 5s"
     hx-swap="outerHTML">
  <pre class="bg-slate-950 border border-slate-700 rounded-xl p-4 text-xs leading-relaxed overflow-x-auto max-h-[70vh] overflow-y-auto whitespace-pre-wrap">Lädt…</pre>
</div>
{% endblock %}
