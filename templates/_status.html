{# HTMX partial – returned by GET /api/status-html #}
<div id="status-badges"
     hx-get="/api/status-html"
     hx-trigger="every 15s"
     hx-swap="outerHTML"
     class="flex items-center gap-2 text-xs">
  <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full font-medium
               {% if serial_connected %}bg-green-950 text-green-400{% else %}bg-slate-800 text-slate-500{% endif %}">
    <span class="w-1.5 h-1.5 rounded-full
                 {% if serial_connected %}bg-green-400{% else %}bg-slate-600{% endif %}"></span>
    Serial
  </span>
  <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full font-medium
               {% if mqtt_connected %}bg-blue-950 text-blue-400{% else %}bg-slate-800 text-slate-500{% endif %}">
    <span class="w-1.5 h-1.5 rounded-full
                 {% if mqtt_connected %}bg-blue-400{% else %}bg-slate-600{% endif %}"></span>
    MQTT
  </span>
  {% if last_poll_ts %}
  <span class="text-slate-600 hidden sm:inline" title="{{ last_poll_ts }}">
    letzte Erfassung: {{ last_poll_ts[11:19] }} UTC
  </span>
  {% endif %}
</div>
