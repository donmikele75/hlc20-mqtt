{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="flex items-center justify-between mb-6">
  <h1 class="text-xl font-semibold text-slate-100">Dashboard</h1>
  <button class="text-sm text-slate-400 hover:text-slate-100 flex items-center gap-1.5
                 transition-colors"
          hx-get="/api/dashboard-partial"
          hx-target="#dashboard-values"
          hx-swap="outerHTML"
          hx-indicator="#refresh-spin">
    <svg id="refresh-spin" class="w-4 h-4 htmx-indicator" fill="none" stroke="currentColor"
         viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
    </svg>
    Aktualisieren
  </button>
</div>

{% include "_dashboard_values.html" %}
{% endblock %}
