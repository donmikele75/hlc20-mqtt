<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Segoe UI, Arial, sans-serif">
  <style>
    .vl { stroke:#e04b2f; stroke-width:3.5; fill:none; }
    .rl { stroke:#2f6fe0; stroke-width:3.5; fill:none; }
    .box { fill:#1e293b; stroke:#475569; stroke-width:2; rx:10; }
    .boxLabel { fill:#e2e8f0; font-size:15px; font-weight:600; }
    .sensor { fill:#0f172a; stroke:#38bdf8; stroke-width:2.5; }
    .sensorValue { fill:#f8fafc; font-size:14px; font-weight:700; text-anchor:middle; }
    .pump { fill:#312e81; stroke:#818cf8; stroke-width:2.5; }
    .pumpLabel { fill:#c7d2fe; font-size:11px; text-anchor:middle; }
    .mixer { fill:#3f2d0b; stroke:#f59e0b; stroke-width:2.5; }
    .mixerLabel { fill:#1c1917; font-size:9px; text-anchor:middle; font-weight:700; }
    .groupLabel { fill:#94a3b8; font-size:13px; font-style:italic; }
    .sectionTitle { fill:#f1f5f9; font-size:20px; font-weight:700; }
    .thresh { fill:#64748b; font-size:11px; }
  </style>

  <rect x="0" y="0" width="1400" height="900" fill="#0b1220"/>
  <text x="20" y="30" class="sectionTitle">Hanazeder HLC-20 – Anlagenschema</text>

  <!-- ═══════════════ SOLARANLAGE ═══════════════ -->
  <g id="group-solar">
    <text x="40" y="65" class="groupLabel">Solaranlage</text>
    <rect x="20" y="90" width="170" height="150" class="box" rx="8"/>
    <text x="105" y="112" class="boxLabel" text-anchor="middle" font-size="13">Solar</text>
    <text x="105" y="140" class="thresh" text-anchor="middle" id="sensor-waermemenge_kw">Leistung: 30.4 kW</text>
    <text x="105" y="158" class="thresh" text-anchor="middle" id="value-waermemenge_kwh">Energie: 0.2 kWh</text>

    <circle id="pump-pumpe_solar" cx="260" cy="225" r="15" class="pump" style="fill:none"/>
    <text x="260" y="229" class="pumpLabel" font-size="13">P</text>
    <text x="260" y="200" class="pumpLabel">Aus</text>

    <path class="vl" d="M190,190 L230,190 L230,225 L245,225"/>
    <path class="vl" d="M275,225 L325,225"/>
    <circle id="sensor-vorl_solar" cx="340" cy="225" r="15" class="sensor"/>
    <text x="340" y="229" class="sensorValue" font-size="11">30.1°</text>
    <path class="vl" d="M355,225 L400,225 L400,300"/>
    <path class="rl" d="M400,320 L315,320"/>
    <circle id="sensor-rueckl_solar" cx="300" cy="320" r="15" class="sensor"/>
    <text x="300" y="324" class="sensorValue" font-size="11">29.6°</text>
    <path class="rl" d="M285,320 L210,320 L210,230 L190,230"/>
  </g>

  <!-- ═══════════════ KESSEL (bleibt unterhalb y=460) ═══════════════ -->
  <g id="group-kessel">
    <text x="40" y="470" class="groupLabel">Wärmeerzeugung</text>
    <rect x="30" y="480" width="170" height="90" class="box" rx="8"/>
    <text x="115" y="502" class="boxLabel" text-anchor="middle" font-size="13">Kessel</text>
    <text x="115" y="520" class="thresh" text-anchor="middle" id="sensor-brenner">Brenner: Aus</text>

    <circle id="pump-pumpe_kessel" cx="270" cy="520" r="15" class="pump" style="fill:none"/>
    <text x="270" y="524" class="pumpLabel" font-size="13">P</text>
    <text x="270" y="490" class="pumpLabel">Aus</text>

    <path class="vl" d="M200,500 L230,500 L230,520 L255,520"/>
    <path class="vl" d="M285,520 L340,520 L340,460 L400,460"/>
    <path class="rl" d="M400,495 L355,495 L355,540 L200,540"/>
  </g>

  <!-- ═══════════════ PUFFERSPEICHER ═══════════════ -->
  <g id="group-puffer">
    <text x="420" y="210" class="groupLabel">Pufferspeicher</text>
    <rect x="400" y="230" width="200" height="420" rx="24" fill="#1e293b" stroke="#64748b" stroke-width="3"/>

    <line x1="400" y1="375" x2="600" y2="375" stroke="#334155" stroke-width="2"/>
    <line x1="400" y1="525" x2="600" y2="525" stroke="#334155" stroke-width="2"/>

    <circle id="sensor-puff_oben" cx="500" cy="300" r="20" class="sensor"/>
    <text id="value-puff_oben" x="500" y="305" class="sensorValue">58.6°</text>
    <text x="500" y="350" class="thresh" text-anchor="middle" id="sensor-puffo_ein">Ein 47.0 / Aus 55.0°C</text>

    <circle id="sensor-puff_mitte" cx="500" cy="450" r="20" class="sensor"/>
    <text id="value-puff_mitte" x="500" y="455" class="sensorValue">47.4°</text>
    <text x="500" y="500" class="thresh" text-anchor="middle" id="sensor-puffm_ein">Ein 42.0 / Aus 62.0°C</text>

    <circle id="sensor-puff_unten" cx="500" cy="600" r="20" class="sensor"/>
    <text id="value-puff_unten" x="500" y="605" class="sensorValue">47.3°</text>
  </g>

  <!-- ═══════════════ HEIZKREIS HK (Anschluss Puffer-oben, Band y=270-345, kreuzt FBH nicht) ═══════════════ -->
  <g id="group-hk">
    <text x="660" y="200" class="groupLabel">Heizkreis HK (Heizkörper)</text>
    <path class="vl" d="M600,305 L675,305"/>
    <polygon id="mixer-mischer_hk" points="700,280 725,305 700,330 675,305" class="mixer" style="fill:#d97706"/>
    <text x="700" y="309" class="mixerLabel">n/k</text>
    <text x="700" y="345" class="thresh" text-anchor="middle" id="sensor-mischer_hk_zu">Zu: Aus · Auf: Aus</text>

    <circle id="pump-pumpe_hk" cx="790" cy="305" r="15" class="pump" style="fill:none"/>
    <text x="790" y="309" class="pumpLabel" font-size="12">P</text>
    <text x="790" y="284" class="pumpLabel">Aus</text>
    <path class="vl" d="M725,305 L775,305"/>

    <rect x="900" y="270" width="140" height="88" class="box" rx="8"/>
    <text x="970" y="292" class="boxLabel" text-anchor="middle" font-size="13">Heizkörper</text>
    <text x="970" y="312" class="thresh" text-anchor="middle" id="sensor-vl_soll_hk">VL soll: 33.1°</text>
    <text x="970" y="330" class="thresh" text-anchor="middle" id="sensor-hk_tagbetrieb">Tagbetrieb: Ein</text>
    <path class="vl" d="M805,305 L836,305"/>
    <circle id="sensor-vl_ist_hk" cx="850" cy="305" r="14" class="sensor"/>
    <text x="850" y="309" class="sensorValue" font-size="11">31.1°</text>
    <path class="vl" d="M864,305 L900,305"/>
    <path class="rl" d="M900,345 L600,345"/>
  </g>

  <!-- ═══════════════ HEIZKREIS FBH/WH (Anschluss Puffer-mitte, Band y=430-505, kreuzt HK nicht) ═══════════════ -->
  <g id="group-fbh">
    <text x="660" y="410" class="groupLabel">Heizkreis FBH/WH (Fußboden/Wand)</text>
    <path class="vl" d="M600,455 L675,455"/>
    <polygon id="mixer-mischer_fbh" points="700,430 725,455 700,480 675,455" class="mixer" style="fill:#dc2626"/>
    <text x="700" y="459" class="mixerLabel">n/k</text>
    <text x="700" y="495" class="thresh" text-anchor="middle" id="sensor-mischer_fbh_zu">Zu: Ein · Auf: Aus</text>

    <circle id="pump-pumpe_fbh" cx="790" cy="455" r="15" class="pump" style="fill:none"/>
    <text x="790" y="459" class="pumpLabel" font-size="12">P</text>
    <text x="790" y="434" class="pumpLabel">Aus</text>
    <path class="vl" d="M725,455 L775,455"/>

    <rect x="900" y="420" width="140" height="88" class="box" rx="8"/>
    <text x="970" y="442" class="boxLabel" text-anchor="middle" font-size="13">Fußbodenheizung</text>
    <text x="970" y="462" class="thresh" text-anchor="middle" id="sensor-vl_soll_fbh">VL soll: 5.0°</text>
    <text x="970" y="480" class="thresh" text-anchor="middle" id="sensor-fbh_tagbetrieb">Tagbetrieb: Ein</text>
    <path class="vl" d="M805,455 L836,455"/>
    <circle id="sensor-vl_ist_fbh" cx="850" cy="455" r="14" class="sensor"/>
    <text x="850" y="459" class="sensorValue" font-size="11">30.8°</text>
    <path class="vl" d="M864,455 L900,455"/>
    <path class="rl" d="M900,495 L600,495"/>
  </g>

  <!-- ═══════════════ ZIRKULATION BW (Anschluss Puffer-unten, unterhalb allem) ═══════════════ -->
  <g id="group-zirk">
    <text x="420" y="700" class="groupLabel">Zirkulation Brauchwasser</text>
    <path class="rl" d="M455,660 L455,720 L640,720"/>
    <circle id="sensor-fuhl_zirku_bw" cx="670" cy="720" r="15" class="sensor"/>
    <text x="670" y="724" class="sensorValue" font-size="12">41.5°</text>

    <circle id="pump-pumpe_zirk" cx="760" cy="720" r="15" class="pump" style="fill:none"/>
    <text x="760" y="724" class="pumpLabel" font-size="12">P</text>
    <text x="760" y="746" class="pumpLabel">Aus</text>
    <path class="rl" d="M685,720 L745,720"/>
    <path class="vl" d="M775,720 L840,720 L840,670 L545,670 L545,660"/>
    <text x="760" y="765" class="thresh" text-anchor="middle">Ein 30 / Aus 40°C</text>
  </g>

  <!-- ═══════════════ AUSSEN ═══════════════ -->
  <g id="group-umgebung">
    <text x="1160" y="65" class="groupLabel">Umgebung</text>
    <circle id="sensor-aussenfuehler" cx="1200" cy="105" r="18" class="sensor"/>
    <text x="1200" y="109" class="sensorValue" font-size="12">21.6°</text>
  </g>
</svg>
