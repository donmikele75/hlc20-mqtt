services:
  hlc20-mqtt:
    image: ghcr.io/donmikele75/hlc20-mqtt:latest
    container_name: hlc20-mqtt
    restart: unless-stopped
    network_mode: host   # Port 80 direkt auf Host erreichbar (kein ports: mapping nötig)
    environment:
      # Startwerte für ersten Start ohne config.json; danach Einstellungen-Seite nutzen
      # SILEX_HOST/SILEX_PORT bewusst entfernt: bei fehlendem config.json wuerden diese
      # sonst stillschweigend auf einen veralteten/falschen Serial-Server zeigen.
      MQTT_HOST: "mqtt.int.wagner.tc"
      MQTT_PORT: "1883"
      MQTT_USER: "mqtt"
      MQTT_PASSWORD: "1mages+Words"
      POLL_INTERVAL: "60"
      DEVICE_TOPIC: "hlc20"
      DISCOVERY_PREFIX: "homeassistant"
    volumes:
      - hlc20_data:/app/data   # Persistiert config.json über Container-Neustarts
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hlc20_data:
